const fd=d=>d&&d.split("-").reverse().join("/");

/* ── LICENCE ───────────────────────────────────────────── */
const PUB=window.PUB_KEY||null;
const TRIAL=7;
let lic=null,lockMsg="";
const dys=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const addD=(a,n)=>{const d=new Date(a+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};
const licSave=()=>{try{localStorage.setItem("bgusto_lic",JSON.stringify(lic))}catch(e){}};
function licInit(){const t=today();try{lic=JSON.parse(localStorage.getItem("bgusto_lic"))}catch(e){lic=null}
 if(!lic||!lic.id){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=crypto.getRandomValues(new Uint8Array(6));lic={id:[...r].map(x=>A[x%32]).join(""),inst:t,until:null,seen:t};licSave()}}
const validUntil=()=>{const tr=addD(lic.inst,TRIAL);return lic.until&&lic.until>tr?lic.until:tr};
const left=()=>dys(today(),validUntil());
function licTick(){const t=today();lockMsg=lic.seen>t&&dys(t,lic.seen)>1?"La fecha del teléfono no es correcta. Corregila para continuar.":"";if(!lockMsg&&lic.seen<t){lic.seen=t;licSave()}}
const isLocked=()=>!!(lockMsg||left()<0);
const b64=x=>Uint8Array.from(atob(x.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function activate(tok){const m=$("#lm"),say=t=>{if(m)m.textContent=t;else alert(t)};
 try{const p=String(tok).trim().split(".");if(p.length!==3)throw"Clave inválida";const[id,u,sg]=p;
  if(id!==lic.id)throw"Esta clave es de otro dispositivo";
  const d=u.slice(0,4)+"-"+u.slice(4,6)+"-"+u.slice(6,8);
  const k=await crypto.subtle.importKey("jwk",PUB,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
  if(!await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},k,b64(sg),new TextEncoder().encode(id+"."+u)))throw"Clave inválida";
  if(d<today())throw"Esta clave ya venció";
  if(!lic.until||d>lic.until)lic.until=d;licSave();render();if(!m)alert("Listo. Suscripción activa hasta el "+fd(lic.until))
 }catch(e){say(typeof e==="string"?e:"Clave inválida")}}
const renewForm=()=>sh(`<div class="hdl"></div><b>Renovar suscripción</b><label>Clave de activación</label><input id="lk" placeholder="Pegá la clave acá" autocapitalize="off" autocomplete="off"><button class="b" style="margin-top:4px" onclick="activate($('#lk').value)">Activar</button><p id="lm" class="red" style="margin-top:8px;font-size:14px"></p>`);
const licTxt=()=>left()<0?"vencida":left()===0?"vence hoy":"quedan "+left()+" día"+(left()===1?"":"s");
const banner0=()=>PUB&&left()>=0&&left()<=5?`<div class="c info am">⏳ Tu suscripción vence ${left()===0?"hoy":"en "+left()+" día"+(left()===1?"":"s")}. Pedí tu clave para renovar.</div>`:"";

function save(){try{localStorage.setItem(SK,JSON.stringify(db))}catch(e){toast("⚠ No se pudo guardar")}}

 if(!db.pagos)db.pagos=[];if(!db.canjes)db.canjes=[];

 if(!db.cfgPuntos)db.cfgPuntos={puntoPorPeso:1};

function cardOrd(o){
  const items=o.items||[{platoNombre:o.platoNombre,cantidad:o.cantidad}];
  const bc=o.estado==="pendiente"?"ch-am":o.estado==="listo"?"ch-gr":"ch-rd";
  const bl=o.estado==="pendiente"?"⏳ Pendiente":o.estado==="listo"?"✅ Listo":"❌ Cancelado";
  const entIcon=o.entrega==="retiro"?"🚶 Retira":"🚐 Mensajero";
  const tot=o.totalPrecio||o.precio*o.cantidad||0;
  let h=`<div class="c"><div class="row" style="margin-bottom:6px"><div><div style="font-size:10px;color:var(--mu);font-weight:700">${esc(o.nro||"")}${o.fecha!==today()?" · "+fd(o.fecha):""}</div><div style="font-size:15px;font-weight:700">${esc(o.clienteNombre)}</div></div><span class="chip ${bc}">${bl}</span></div>`;
  h+=`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px">`;
  items.forEach(it=>{h+=`<span class="chip ch-ac">${esc(it.platoNombre)} x${it.cantidad}</span>`;});
  h+=`</div>`;
  h+=`<div class="mu" style="line-height:1.6">`;
  if(o.clienteDir)h+=`📍 ${esc(o.clienteDir)}<br>`;
  h+=`<span class="chip ch-ac" style="font-size:11px">${entIcon}</span>`;
  if(o.notas)h+=` <span style="font-size:12px;color:var(--mu)">💬 ${esc(o.notas)}</span>`;
  h+=`</div>`;
  if(o.descMonto>0)h+=`<div style="font-size:12px;color:var(--mu);margin-top:4px">Subtotal ${money(o.subtotal||0)} · Desc. -${money(o.descMonto)}</div>`;
  h+=`<div style="font-size:17px;font-weight:700;color:var(--gr);margin-top:4px">${money(tot)}</div>`;
  h+=`<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)">`;
  if(o.estado==="pendiente")h+=`<button class="b w g" onclick="cambEst('${o.id}','listo')">✅ Listo</button>`;
  if(o.estado==="listo")h+=`<button class="b w s" onclick="cambEst('${o.id}','pendiente')">↩</button>`;
  if(o.estado!=="cancelado")h+=`<button class="b w s" onclick="cambEst('${o.id}','cancelado')">Cancelar</button>`;
  h+=`<button class="b w s" onclick="abrirPago('${o.clienteId}')">💰 Pago</button>`;
  h+=`<button class="b w s" onclick="genPDFOrden('${o.id}')">📄 PDF</button>`;
  h+=`<button class="b w s" onclick="genImgOrden('${o.id}')">📷 Img</button>`;
  h+=`<button class="b w s" onclick="abrirComp('${o.id}')">🧾 Comprobante</button>`;
  h+=`<button class="b w s" onclick="waOrdenCliente('${o.id}')">💬 WA Cliente</button>`;
  h+=`<button class="b w s" onclick="waOrdenChef('${o.id}')">💬 WA Chef</button>`;
  h+=`<button class="b w" style="background:#fce;color:var(--rd);border:0" onclick="delOrd('${o.id}')">Eliminar</button>`;
  h+=`</div></div>`;
  return h;
}
function waOrdenCliente(id){
  const o=db.ordenes.find(o=>o.id===id);if(!o)return;
  const brand=db.cfg?.brand||{nombre:"El Buen Gusto",emoji:"🍽️"};
  const items=o.items||[{platoNombre:o.platoNombre,cantidad:o.cantidad}];
  const tot=o.totalPrecio||o.precio*o.cantidad||0;
  const nl="\n";
  let msg=brand.emoji+" *"+brand.nombre+"* - Comprobante"+nl;
  msg+="*Nro:* "+(o.nro||o.id.toUpperCase())+nl;
  msg+="*Fecha:* "+fd(o.fecha)+nl+nl;
  msg+="*Pedido:*"+nl;
  items.forEach(it=>{msg+="  - "+it.platoNombre+" x"+it.cantidad+nl;});
  msg+=nl+"*Entrega:* "+(o.entrega==="retiro"?"Retira el cliente":"Mensajero")+nl;
  if(o.notas)msg+="*Nota:* "+o.notas+nl;
  if(o.descMonto>0)msg+="*Descuento:* -"+money(o.descMonto)+nl;
  msg+="*Total:* "+money(tot)+nl+nl;
  msg+="Gracias por elegirnos!";
  const tel=o.clienteTel?o.clienteTel.replace(/[\s\-\(\)]/g,""):"";
  const url="https://wa.me/"+(tel?tel:"")+"?text="+encodeURIComponent(msg);
  window.open(url,"_blank");
}

  if(o.clienteDir)msg+="*Dir:* "+o.clienteDir+nl2;

function filtrarCliOrd(){
  const q=nz(document.getElementById("oCliBusq")?.value||"");
  const lista=document.getElementById("oCliLista");
  if(!lista)return;
  if(!q){lista.style.display="none";return;}
  const res=db.clientes.filter(c=>nz(c.nombre).includes(q)||(c.tel&&c.tel.includes(q))).slice(0,12).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  if(!res.length){lista.innerHTML=`<div style="padding:10px 14px;color:var(--mu);font-size:13px">Sin resultados</div>`;lista.style.display="block";return;}
  lista.innerHTML=res.map(c=>`<div onclick="selecCliOrden('${c.id}')" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--bd);font-size:14px;font-weight:600">${esc(c.nombre)}<span style="font-size:12px;color:var(--mu);margin-left:8px">${esc(c.tel||"")}</span></div>`).join("");
  lista.style.display="block";
}
function selecCliOrden(cliId){
  const c=db.clientes.find(c=>c.id===cliId);if(!c)return;
  document.getElementById("oCli").value=cliId;
  document.getElementById("oCliBusq").value=c.nombre;
  document.getElementById("oCliLista").style.display="none";
  document.getElementById("oCliSel").textContent="✔ "+c.nombre+(c.tel?" · "+c.tel:"")+(c.dir?" · "+c.dir:"");
  document.getElementById("oCliSel").style.display="block";
  const b=document.getElementById("oCliInfo");if(b)b.innerHTML="";
}
function newCliDesdeOrden(){
  const nom=document.getElementById("oCliBusq")?.value.trim()||"";
  sh(`<div class="hdl"></div><div class="row"><b>Nuevo Cliente</b><button class="bk" onclick="this.closest('.sh').remove()">Cerrar</button></div>
<label>Nombre completo</label><input type="text" id="cNom" value="${esc(nom)}" placeholder="Ej: Ana García">

<button class="b" onclick="guardarCliDesdeOrden()">Guardar y seleccionar</button>`);
}
function guardarCliDesdeOrden(){
  const nombre=document.getElementById("cNom")?.value.trim();
  const tel=document.getElementById("cTel")?.value.trim()||"";
  const dir=document.getElementById("cDir")?.value.trim()||"";
  if(!nombre){alert("Ingresá el nombre");return;}
  const nuevo={id:uid(),nombre,tel,dir,puntos:0,ts:Date.now()};db.clientes.push(nuevo);save();
  closeSh();
  setTimeout(()=>{selecCliOrden(nuevo.id);document.getElementById("oCliBusq").value=nombre;},100);

function addPRow(preId,preCant){
  pRowCount++;
  const idx=pRowCount;
  const cont=document.getElementById("platosC");
  if(!cont)return;
  const preP=preId?db.platos.find(p=>p.id===preId):null;
  const div=document.createElement("div");div.style.cssText="margin-bottom:8px;border:1px solid var(--bd);border-radius:10px;padding:9px 11px;background:var(--bg)";
  div.id="pRow"+idx;
  div.innerHTML=`
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input type="search" id="rBusq${idx}" placeholder="Buscar plato..." autocomplete="off" oninput="filtrarPlatoRow(${idx})" value="${esc(preP?preP.nombre:'')}" style="flex:1;min-width:120px;margin:0">
      <input type="number" id="rCnt${idx}" value="${preCant||1}" min="1" oninput="updSub${idx}()" style="width:56px;margin:0;text-align:center;flex-shrink:0">
      <button class="rm" onclick="document.getElementById('pRow${idx}').remove();calcDesc()">×</button>
    </div>
    <div id="rLista${idx}" style="max-height:150px;overflow-y:auto;border:1px solid var(--bd);border-radius:8px;margin-top:5px;display:none"></div>
    <input type="hidden" id="rPId${idx}" value="${preId||''}">
    <div class="plato-sub" id="rSub${idx}">${preP?"Subtotal: "+money(preP.precio*(preCant||1)):''}</div>`;
  cont.appendChild(div);
  window["updSub"+idx]=function(){
    const pId=document.getElementById("rPId"+idx)?.value;
    const p=db.platos.find(p=>p.id===pId);
    const c=parseInt(document.getElementById("rCnt"+idx)?.value)||1;
    const sub=document.getElementById("rSub"+idx);
    if(sub)sub.textContent=p?"Subtotal: "+money(p.precio*c):"";
    calcDesc();
  };
  window["updSub"+idx]();
}
function filtrarPlatoRow(idx){
  const q=nz(document.getElementById("rBusq"+idx)?.value||"");
  const lista=document.getElementById("rLista"+idx);
  if(!lista)return;
  if(!q){lista.style.display="none";return;}
  const res=db.platos.filter(p=>nz(p.nombre).includes(q)||(p.desc&&nz(p.desc).includes(q))).slice(0,10).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  if(!res.length){lista.innerHTML=`<div style="padding:8px 12px;color:var(--mu);font-size:13px">Sin resultados</div>`;lista.style.display="block";return;}
  lista.innerHTML=res.map(p=>`<div onclick="selecPlatoRow(${idx},'${p.id}')" style="padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--bd);font-size:13px"><b>${esc(p.nombre)}</b> <span style="color:var(--gr);font-weight:700">${money(p.precio)}</span></div>`).join("");
  lista.style.display="block";
}
function selecPlatoRow(idx,pId){
  const p=db.platos.find(p=>p.id===pId);if(!p)return;
  const hid=document.getElementById("rPId"+idx);const busq=document.getElementById("rBusq"+idx);const lista=document.getElementById("rLista"+idx);
  if(hid)hid.value=pId;if(busq)busq.value=p.nombre;if(lista)lista.style.display="none";
  if(window["updSub"+idx])window["updSub"+idx]();
}
function getItemsOrden(){
  const cont=document.getElementById("platosC");if(!cont)return[];
  const items=[];
  let idx=1;
  while(document.getElementById("pRow"+idx)){
    const pId=document.getElementById("rPId"+idx)?.value;
    const cant=parseInt(document.getElementById("rCnt"+idx)?.value)||1;
    if(pId){const p=db.platos.find(p=>p.id===pId);if(p)items.push({platoId:p.id,platoNombre:p.nombre,precio:p.precio,costo:p.costo||0,cantidad:cant});}
    idx++;
  }
  return items;
}
function setEnt(v,btn){entrega=v;document.querySelectorAll(".sh .etog button").forEach(b=>b.classList.remove("on"));btn.classList.add("on");}
function setDesc(v){descTipo=v;const ep=document.getElementById("dPct"),em=document.getElementById("dMonto");if(!ep||!em)return;ep.classList.toggle("on",v==="pct");em.classList.toggle("on",v==="monto");calcDesc();}
function getSubtotal(){
  let s=0,idx=1;
  while(document.getElementById("pRow"+idx)){
    const pId=document.getElementById("rPId"+idx)?.value;
    const c=parseInt(document.getElementById("rCnt"+idx)?.value)||1;
    const p=db.platos.find(p=>p.id===pId);
    if(p)s+=p.precio*c;idx++;
  }
  return s;
}
function calcDesc(){
  const val=parseFloat(document.getElementById("oDesc")?.value)||0;
  const sub=getSubtotal();
  const el=document.getElementById("descInfo");if(!el)return;
  if(val>0&&sub>0){const desc=descTipo==="pct"?sub*(val/100):Math.min(val,sub);el.innerHTML=`<div class="info am" style="margin-bottom:6px">Descuento: -${money(desc)} → Total: ${money(sub-desc)}</div>`;}
  else el.innerHTML="";
}
function guardarOrden(){
  const cId=document.getElementById("oCli")?.value;
  const fecha=document.getElementById("oFecha")?.value||today();
  const notas=document.getElementById("oNotas")?.value.trim()||"";
  const descVal=parseFloat(document.getElementById("oDesc")?.value)||0;
  if(!cId){alert("Seleccioná un cliente");return;}
  const items=getItemsOrden();
  if(!items.length){alert("Agregá al menos un plato");return;}
  const c=db.clientes.find(c=>c.id===cId);
  const nro="VD-"+Date.now().toString().slice(-6);
  const subtotal=items.reduce((s,i)=>s+i.precio*i.cantidad,0);
  let descMonto,descPct;
  if(descTipo==="pct"){descPct=Math.min(Math.max(descVal,0),100);descMonto=Math.round(subtotal*(descPct/100)*100)/100;}
  else{descMonto=Math.min(Math.max(descVal,0),subtotal);descPct=subtotal>0?Math.round(descMonto/subtotal*10000)/100:0;}
  const totalPrecio=subtotal-descMonto;
  const totalCosto=items.reduce((s,i)=>s+i.costo*i.cantidad,0);
  const totalCant=items.reduce((s,i)=>s+i.cantidad,0);
  const ppp=db.cfgPuntos.puntoPorPeso||1;
  const ptsGanados=Math.floor(totalPrecio*ppp);
  if(!c.puntos)c.puntos=0;c.puntos+=ptsGanados;
  db.ordenes.push({id:uid(),nro,fecha,clienteId:cId,clienteNombre:c.nombre,clienteTel:c.tel||"",clienteDir:c.dir||"",items,platoNombre:items.map(i=>i.platoNombre+(items.length>1?" x"+i.cantidad:"")).join(", "),precio:totalPrecio/totalCant,costo:totalCosto/totalCant,cantidad:totalCant,subtotal,descPct,descMonto,totalPrecio,totalCosto,ts:Date.now(),notas,entrega,estado:"pendiente"});
  closeSh();rf();toast("Orden creada · +"+ptsGanados+" pts");
}
function onCliCh(){const v=document.getElementById("oCli")?.value;const c=db.clientes.find(c=>c.id===v);const b=document.getElementById("oCliInfo");if(!b)return;b.innerHTML=c&&(c.tel||c.dir)?`<div class="info" style="margin-bottom:6px">${c.tel?"📞 "+esc(c.tel)+(c.dir?"<br>":""):""}${c.dir?"📍 "+esc(c.dir):""}</div>`:""}

function renderCli(){
  const _f=getFab();_f.onclick=()=>newCliForm();_f.style.display="flex";
  let lista=db.clientes.filter(c=>{
    if(soloDeudores&&getSaldo(c.id).saldo<=0)return false;
    if(!busqCli)return true;
    const q=nz(busqCli);return nz(c.nombre).includes(q)||(c.tel&&c.tel.includes(q))||(c.dir&&nz(c.dir).includes(q));
  }).slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const totalDeudores=db.clientes.filter(c=>getSaldo(c.id).saldo>0).length;
  let html=`<h1>👥 Clientes</h1>`;
  html+=`<div style="display:flex;gap:8px;margin-bottom:10px">`;
  html+=`<input style="margin:0;flex:1" placeholder="Buscar por nombre, tel o dirección..." value="${esc(busqCli)}" oninput="busqCli=this.value;renderCli()" onkeydown="if(event.key==='Enter')renderCli()">`;
  html+=`</div>`;
  html+=`<div style="display:flex;gap:6px;margin-bottom:10px"><button onclick="soloDeudores=!soloDeudores;renderCli()" style="padding:7px 13px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid ${soloDeudores?"var(--rd)":"var(--bd)"};background:${soloDeudores?"#fce":"var(--card)"};color:${soloDeudores?"var(--rd)":"var(--mu)"};cursor:pointer">💸 Deudores${totalDeudores>0?" ("+totalDeudores+")":""}</button></div>`;
  html+=`<div class="mu" style="margin-bottom:8px">${db.clientes.length} clientes${busqCli?" · "+lista.length+" resultados":""}</div>`;
  if(!lista.length)html+=`<div class="c" style="text-align:center;color:var(--mu);padding:24px 0">${busqCli?'Sin resultados para "'+esc(busqCli)+'"':"Sin clientes. Tocá + para agregar."}</div>`;
  else lista.forEach(c=>{
    const cc=getSaldo(c.id);
    const sColor=cc.saldo>0?"var(--rd)":cc.saldo<0?"var(--gr)":"var(--mu)";
    const sLabel=cc.saldo>0?"Debe "+money(cc.saldo):cc.saldo<0?"A favor "+money(-cc.saldo):"Al día";
    html+=`<div class="c"><div class="row" style="margin-bottom:6px"><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700">${esc(c.nombre)}</div><div class="mu" style="margin-top:2px">${c.tel?"📞 "+esc(c.tel):""} ${c.dir?"📍 "+esc(c.dir):""}</div><div style="font-size:12px;font-weight:700;color:${sColor};margin-top:3px">${sLabel}</div></div>${(c.puntos||0)>0?`<span class="chip ch-pt">⭐ ${c.puntos}</span>`:""}</div><div style="display:flex;flex-wrap:wrap;gap:5px"><button class="b w s" onclick="verCC('${c.id}')">📒 Cta Cte</button><button class="b w s" onclick="abrirPago('${c.id}')">💰 Pago</button>${(c.puntos||0)>0?`<button class="b w s" onclick="abrirNotifPts('${c.id}')">📷 Pts</button>`:""}` +
    `<button class="b w s" onclick="editCli('${c.id}')">Editar</button><button class="b w" style="background:#fce;color:var(--rd);border:0" onclick="delCli('${c.id}')">✕</button></div></div>`;
  });
  $("#app").innerHTML=html;
}
function newCliForm(id){
  const c=id?db.clientes.find(c=>c.id===id):null;
  sh(`<div class="hdl"></div><div class="row"><b>${c?"Editar Cliente":"Nuevo Cliente"}</b><button class="bk" onclick="this.closest('.sh').remove()">Cerrar</button></div>
<label>Nombre completo</label><input type="text" id="cNom" value="${esc(c?.nombre||"")}" placeholder="Ej: Ana García">
<label>Teléfono</label><input type="tel" id="cTel" value="${esc(c?.tel||"")}" placeholder="Ej: 3442-123456">
<label>Dirección</label><input type="text" id="cDir" value="${esc(c?.dir||"")}" placeholder="Ej: San Martín 456">
<button class="b" onclick="guardarCli('${c?.id||""}')">Guardar</button>`);
}
function guardarCli(id){
  const nombre=document.getElementById("cNom")?.value.trim();
  const tel=document.getElementById("cTel")?.value.trim();
  const dir=document.getElementById("cDir")?.value.trim();
  if(!nombre){alert("Ingresá el nombre");return;}
  if(id){const c=db.clientes.find(c=>c.id===id);if(c){c.nombre=nombre;c.tel=tel;c.dir=dir;}}
  else db.clientes.push({id:uid(),nombre,tel,dir,puntos:0,ts:Date.now()});
  closeSh();rf();toast("Cliente guardado");
}
function editCli(id){newCliForm(id)}
function delCli(id){if(!confirm("¿Eliminar este cliente?"))return;db.clientes=db.clientes.filter(c=>c.id!==id);rf();}

/* ── CUENTA CORRIENTE ──────────────────────────────────── */
function verCC(cliId){
  const c=db.clientes.find(c=>c.id===cliId);if(!c)return;
  const cc=getSaldo(cliId);
  const movs=[];
  db.ordenes.filter(o=>o.clienteId===cliId&&o.estado!=="cancelado").forEach(o=>movs.push({tipo:"ord",fecha:o.fecha,ts:o.ts,desc:o.platoNombre,nro:o.nro,monto:o.totalPrecio||o.precio*o.cantidad}));
  db.pagos.filter(p=>p.clienteId===cliId).forEach(p=>movs.push({tipo:"pag",fecha:p.fecha,ts:p.ts,desc:p.forma==="efectivo"?"Pago efectivo":"Pago transferencia",nota:p.nota,monto:p.monto}));
  movs.sort((a,b)=>b.ts-a.ts);
  let html=`<div class="hdl"></div><div class="row"><b>${esc(c.nombre)}</b><button class="bk" onclick="this.closest('.sh').remove()">Cerrar</button></div>`;
  html+=`<div class="grid3" style="gap:8px;margin-bottom:12px"><div class="c" style="text-align:center;margin:0"><div class="mu">Debe</div><div class="big red">${money(cc.debe)}</div></div><div class="c" style="text-align:center;margin:0"><div class="mu">Haber</div><div class="big grn">${money(cc.haber)}</div></div><div class="c" style="text-align:center;margin:0;border-color:${cc.saldo>0?"var(--rd)":"var(--gr)"}"><div class="mu">Saldo</div><div class="big" style="color:${cc.saldo>0?"var(--rd)":"var(--gr)"}">${money(cc.saldo)}</div></div></div>`;
  html+=`<button class="b" style="margin-bottom:12px" onclick="closeSh();abrirPago('${cliId}')">+ Registrar Pago</button>`;
  if(movs.length){html+=`<h2>Movimientos</h2>`;movs.forEach(m=>{html+=`<div class="row c" style="margin-bottom:6px;padding:10px 12px"><div><div style="font-size:13px;font-weight:700">${esc(m.desc)}</div>${m.nota?`<div class="mu">${esc(m.nota)}</div>`:""}<div class="mu">${fmtDate(m.fecha)}${m.nro?" · "+m.nro:""}</div></div><span style="font-weight:700;color:${m.tipo==="ord"?"var(--rd)":"var(--gr)"}">${m.tipo==="ord"?"-":"+"} ${money(m.monto)}</span></div>`;});}
  sh(html);
}

/* ── PAGOS ─────────────────────────────────────────────── */
function abrirPago(cliId){
  const c=db.clientes.find(c=>c.id===cliId);if(!c)return;
  const cc=getSaldo(cliId);
  sh(`<div class="hdl"></div><div class="row"><b>Registrar Pago</b><button class="bk" onclick="this.closest('.sh').remove()">Cerrar</button></div>
<div style="font-size:15px;font-weight:700;margin-bottom:8px">${esc(c.nombre)}</div>
<div class="info am" style="margin-bottom:12px">Saldo pendiente: ${money(cc.saldo)}</div>
<label>Monto ($)</label><input type="number" id="pMonto" placeholder="0.00" step="0.01">
<label>Forma de pago</label>
<div class="seg" id="fpSeg"><button class="on" onclick="setFP('efectivo',this)">💵 Efectivo</button><button onclick="setFP('transferencia',this)">📲 Transferencia</button></div>
<label>Nota (opcional)</label><input type="text" id="pNota" placeholder="Ej: pago parcial...">
<input type="hidden" id="pCliId" value="${cliId}">
<button class="b" onclick="guardarPago()" style="margin-top:4px">Registrar Pago</button>`);
  formaPago="efectivo";
}
function setFP(v,btn){formaPago=v;document.querySelectorAll(".sh #fpSeg button").forEach(b=>b.classList.remove("on"));btn.classList.add("on");}
function guardarPago(){
  const cliId=document.getElementById("pCliId")?.value;
  const monto=parseFloat(document.getElementById("pMonto")?.value)||0;
  const nota=document.getElementById("pNota")?.value.trim()||"";
  if(!monto||monto<=0){alert("Ingresá un monto válido");return;}
  db.pagos.push({id:uid(),clienteId:cliId,monto,forma:formaPago,nota,fecha:today(),ts:Date.now()});
  closeSh();rf();toast("Pago registrado");
}

function renderPla(){

  let html=`<h1>🥘 Platos</h1>`;
  html+=`<div style="display:flex;gap:8px;margin-bottom:10px"><input style="margin:0;flex:1" placeholder="Buscar plato..." value="${esc(busqPla)}" oninput="busqPla=this.value;renderPla()" onkeydown="if(event.key==='Enter')renderPla()"></div>`;
  html+=`<div class="mu" style="margin-bottom:8px">${db.platos.length} platos${busqPla?" · "+lista.length+" resultados":""}</div>`;

  });
  $("#app").innerHTML=html;
}
function newPlaForm(id){
  const p=id?db.platos.find(p=>p.id===id):null;
  sh(`<div class="hdl"></div><div class="row"><b>${p?"Editar Plato":"Nuevo Plato"}</b><button class="bk" onclick="this.closest('.sh').remove()">Cerrar</button></div>
<label>Nombre del plato</label><input type="text" id="pNom" value="${esc(p?.nombre||"")}" placeholder="Ej: Milanesa con ensalada">
<div class="grid2"><div><label>Costo ($)</label><input type="number" id="pCosto" value="${p?.costo||0}" placeholder="0" step="0.01" oninput="calcMgn()"></div><div><label>Precio venta ($)</label><input type="number" id="pPrecio" value="${p?.precio||""}" placeholder="0" step="0.01" oninput="calcMgn()"></div></div>
<div id="pMgn"></div>

function calcMgn(){const c=parseFloat(document.getElementById("pCosto")?.value)||0,p=parseFloat(document.getElementById("pPrecio")?.value)||0;const b=document.getElementById("pMgn");if(!b)return;b.innerHTML=c>0&&p>0?`<div class="info gr" style="margin-bottom:6px">Margen: ${((p-c)/p*100).toFixed(1)}% · Ganancia: ${money(p-c)}</div>`:""}
function guardarPla(id){
  const nombre=document.getElementById("pNom")?.value.trim();
  const costo=parseFloat(document.getElementById("pCosto")?.value)||0;
  const precio=parseFloat(document.getElementById("pPrecio")?.value)||0;
  const desc=document.getElementById("pDesc")?.value.trim()||"";
  if(!nombre){alert("Ingresá el nombre");return;}if(!precio){alert("Ingresá el precio");return;}
  if(id){const p=db.platos.find(p=>p.id===id);if(p){p.nombre=nombre;p.costo=costo;p.precio=precio;p.desc=desc;}}
  else db.platos.push({id:uid(),nombre,costo,precio,desc,ts:Date.now()});

function getOrds(p){
  if(p==="dia")return db.ordenes.filter(o=>o.fecha===today()&&o.estado!=="cancelado");
  if(p==="semana"){const w=getWeek();return db.ordenes.filter(o=>inRange(o.fecha,w.from,w.to)&&o.estado!=="cancelado");}
  const mr=getMonthFor(selYear,selMonth);return db.ordenes.filter(o=>inRange(o.fecha,mr.from,mr.to)&&o.estado!=="cancelado");
}
function getTop5Platos(ords){
  const m={};ords.forEach(o=>{(o.items||[{platoNombre:o.platoNombre,cantidad:o.cantidad,precio:o.precio}]).forEach(it=>{if(!m[it.platoNombre])m[it.platoNombre]={q:0,t:0};m[it.platoNombre].q+=it.cantidad;m[it.platoNombre].t+=it.precio*it.cantidad;});});
  return Object.keys(m).map(k=>({n:k,...m[k]})).sort((a,b)=>b.q-a.q).slice(0,5);
}
function getTop5Clientes(ords){
  const m={};ords.forEach(o=>{if(!m[o.clienteNombre])m[o.clienteNombre]={q:0,t:0};m[o.clienteNombre].q+=(o.totalCant||o.cantidad||1);m[o.clienteNombre].t+=(o.totalPrecio||o.precio*o.cantidad||0);});
  return Object.keys(m).map(k=>({n:k,...m[k]})).sort((a,b)=>b.t-a.t).slice(0,5);
}
function top5HTML(items,label,icon){
  if(!items.length)return"";
  const max=items[0].q||1;
  let h=`<h2>${icon} ${label}</h2><div class="c">`;
  items.forEach((e,i)=>{const pct=Math.round(e.q/max*100);h+=`<div style="margin-bottom:${i<items.length-1?10:0}px"><div class="row" style="margin-bottom:2px"><span style="font-size:13px;font-weight:700"><span class="mu" style="margin-right:5px">#${i+1}</span>${esc(e.n)}</span><span style="font-size:13px;font-weight:700;color:var(--gr)">${e.q} unid.</span></div><div class="bar" style="margin:3px 0 1px"><i style="width:${pct}%"></i></div><div class="mu" style="font-size:12px">${money(e.t)}</div></div>`;});
  h+=`</div>`;return h;
}
function renderInf(){
  const fab=document.querySelector(".fab");if(fab)fab.style.display="none";
  const ords=getOrds(infPeriodo);
  let label="";
  if(infPeriodo==="dia")label=new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  else if(infPeriodo==="semana"){const w=getWeek();label="Semana: "+fmtDate(w.from)+" al "+fmtDate(w.to);}
  else{const ml=new Date(selYear,selMonth,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"});label=ml.charAt(0).toUpperCase()+ml.slice(1);}
  const tv=ords.reduce((s,o)=>s+(o.totalCant||o.cantidad||0),0);
  const tve=ords.reduce((s,o)=>s+(o.totalPrecio||o.precio*o.cantidad||0),0);
  const tc=ords.reduce((s,o)=>s+(o.totalCosto||o.costo*o.cantidad||0),0);
  const ut=tve-tc;
  let html=`<h1>📊 Informe</h1>`;
  html+=`<div class="seg"><button class="${infPeriodo==="dia"?"on":""}" onclick="infPeriodo='dia';renderInf()">Hoy</button><button class="${infPeriodo==="semana"?"on":""}" onclick="infPeriodo='semana';renderInf()">Semana</button><button class="${infPeriodo==="mes"?"on":""}" onclick="infPeriodo='mes';selYear=new Date().getFullYear();selMonth=new Date().getMonth();renderInf()">Mes</button></div>`;
  if(infPeriodo==="mes"){html+=`<div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px"><button class="b w s" onclick="selMonth--;if(selMonth<0){selMonth=11;selYear--}renderInf()">◀</button><span style="font-size:14px;font-weight:700;min-width:140px;text-align:center;text-transform:capitalize">${label}</span><button class="b w s" onclick="selMonth++;if(selMonth>11){selMonth=0;selYear++}renderInf()">▶</button></div>`;}
  else html+=`<div style="text-align:center;font-size:13px;color:var(--mu);text-transform:capitalize;margin-bottom:12px">${label}</div>`;
  html+=`<div class="grid2" style="margin-bottom:8px"><div class="c" style="text-align:center"><div class="mu">Viandas</div><div class="big grn">${tv}</div></div><div class="c" style="text-align:center"><div class="mu">Órdenes</div><div class="big">${ords.length}</div></div><div class="c" style="text-align:center"><div class="mu">Total venta</div><div class="big" style="font-size:16px">${money(tve)}</div></div><div class="c" style="text-align:center"><div class="mu">Total costo</div><div class="big" style="font-size:16px">${money(tc)}</div></div></div>`;
  html+=`<div class="c" style="text-align:center;border-color:${ut>=0?"var(--gr)":"var(--rd)"}"><div class="mu">Utilidad neta</div><div class="big" style="font-size:24px;color:${ut>=0?"var(--gr)":"var(--rd)"}">${money(ut)}</div></div>`;
  html+=`<button class="b s" style="margin-bottom:4px" onclick="exportInfPDF()">📄 Exportar PDF</button>`;
  const periodoLabel=infPeriodo==="dia"?"Hoy":infPeriodo==="semana"?"Semana":"Mes";
  html+=top5HTML(getTop5Platos(ords),"Top platos — "+periodoLabel,"🥘");
  const anioR=getYear();const ordsAnio=db.ordenes.filter(o=>inRange(o.fecha,anioR.from,anioR.to)&&o.estado!=="cancelado");
  html+=top5HTML(getTop5Platos(ordsAnio),"Top platos — Año "+new Date().getFullYear(),"📅");
  html+=top5HTML(getTop5Clientes(ords),"Top clientes — "+periodoLabel,"👥");
  html+=top5HTML(getTop5Clientes(ordsAnio),"Top clientes — Año "+new Date().getFullYear(),"🏆");
  // detalle
  const pm={};ords.forEach(o=>{(o.items||[{platoNombre:o.platoNombre,cantidad:o.cantidad,precio:o.precio}]).forEach(it=>{if(!pm[it.platoNombre])pm[it.platoNombre]={q:0,t:0};pm[it.platoNombre].q+=it.cantidad;pm[it.platoNombre].t+=it.precio*it.cantidad;});});
  const dp=Object.keys(pm).map(k=>({n:k,...pm[k]})).sort((a,b)=>b.q-a.q);
  if(dp.length){html+=`<h2>Detalle por plato</h2><div class="c">`;dp.forEach(e=>{html+=`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--bd)"><span style="font-size:13px;font-weight:600">${esc(e.n)}</span><div style="text-align:right"><div style="font-size:13px;font-weight:700;color:var(--gr)">${e.q} unid.</div><div class="mu">${money(e.t)}</div></div></div>`;});html+=`</div>`;}
  if(!ords.length)html+=`<div class="c" style="text-align:center;color:var(--mu);padding:24px 0">Sin ventas en este período.</div>`;
  $("#app").innerHTML=html;
}
function exportInfPDF(){
  const ords=getOrds(infPeriodo);
  const tv=ords.reduce((s,o)=>s+(o.totalCant||o.cantidad||0),0);
  const tve=ords.reduce((s,o)=>s+(o.totalPrecio||o.precio*o.cantidad||0),0);
  const tc=ords.reduce((s,o)=>s+(o.totalCosto||o.costo*o.cantidad||0),0);
  let label="";
  if(infPeriodo==="dia")label=new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  else if(infPeriodo==="semana"){const w=getWeek();label="Semana "+fmtDate(w.from)+" al "+fmtDate(w.to);}
  else{const ml=new Date(selYear,selMonth,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"});label=ml.charAt(0).toUpperCase()+ml.slice(1);}
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  const W=210,mg=15;let y=mg;
  doc.setFillColor(192,113,58);doc.rect(0,0,W,32,"F");
  doc.setTextColor(255,255,255);doc.setFontSize(16);doc.setFont("helvetica","bold");
  doc.text("EL BUEN GUSTO — INFORME",mg,12);
  doc.setFontSize(9);doc.setFont("helvetica","normal");
  doc.text(label.charAt(0).toUpperCase()+label.slice(1),mg,21);doc.text(new Date().toLocaleString("es-AR"),W-mg,21,{align:"right"});y=42;
  doc.setFillColor(250,238,222);doc.roundedRect(mg,y,W-mg*2,26,3,3,"F");
  doc.setTextColor(192,113,58);doc.setFontSize(10);doc.setFont("helvetica","bold");
  doc.text("Viandas: "+tv,mg+4,y+9);doc.text("Órdenes: "+ords.length,mg+40,y+9);doc.text("Venta: "+money(tve),mg+76,y+9);doc.text("Costo: "+money(tc),mg+4,y+20);
  const ut=tve-tc;doc.setTextColor(ut>=0?47:192,ut>=0?122:67,ut>=0?74:58);doc.text("Utilidad: "+money(ut),mg+40,y+20);y+=34;
  const top=getTop5Platos(ords);
  if(top.length){doc.setTextColor(100,80,60);doc.setFontSize(9);doc.setFont("helvetica","bold");doc.text("TOP 5 PLATOS",mg,y);y+=5;doc.setDrawColor(192,113,58);doc.setLineWidth(0.4);doc.line(mg,y,W-mg,y);y+=6;
  const mx=top[0].q||1;top.forEach((e,i)=>{doc.setTextColor(30,26,22);doc.setFontSize(10);doc.setFont("helvetica","bold");doc.text("#"+(i+1)+" "+e.n,mg+2,y);doc.setTextColor(47,122,74);doc.text("x"+e.q+"  "+money(e.t),W-mg,y,{align:"right"});doc.setFillColor(220,240,228);doc.rect(mg+2,y+2,((W-mg*2-4)*e.q/mx),4,"F");y+=13;});y+=4;}
  doc.setTextColor(140,126,114);doc.setFontSize(8);doc.setFont("helvetica","normal");doc.text("El Buen Gusto — "+new Date().toLocaleString("es-AR"),W/2,y,{align:"center"});
  doc.save("informe-bgusto-"+today()+".pdf");toast("Informe PDF generado");
}

function abrirPDFDia(){
  const hoy=db.ordenes.filter(o=>o.fecha===today()&&o.estado!=="cancelado").sort((a,b)=>a.clienteNombre.localeCompare(b.clienteNombre));
  const pm={};hoy.forEach(o=>{(o.items||[{platoNombre:o.platoNombre,cantidad:o.cantidad}]).forEach(it=>{if(!pm[it.platoNombre])pm[it.platoNombre]=0;pm[it.platoNombre]+=it.cantidad;});});
  const tv=hoy.reduce((s,o)=>s+(o.totalCant||o.cantidad||0),0);
  if(!hoy.length){sh(`<div class="hdl"></div><p class="mu" style="text-align:center;padding:24px">Sin órdenes activas hoy.</p>`);return;}
  let html=`<div class="hdl"></div><div class="row"><b>Orden del día — Chef</b><button class="bk" onclick="this.closest('.sh').remove()">Cerrar</button></div>`;
  html+=`<div class="info gr" style="margin-bottom:10px">${hoy.length} órdenes · ${tv} viandas</div>`;
  hoy.forEach(o=>{const items=o.items||[{platoNombre:o.platoNombre,cantidad:o.cantidad}];html+=`<div class="c" style="padding:10px 12px;margin-bottom:7px"><div style="font-size:14px;font-weight:700">${esc(o.clienteNombre)}</div><div class="mu">${items.map(it=>esc(it.platoNombre)+" x"+it.cantidad).join(" · ")}${o.notas?" · "+esc(o.notas):""}${o.entrega==="retiro"?" · Retira":"  · Mensajero"}</div><div style="color:var(--gr);font-weight:700">${money(o.totalPrecio||o.precio*o.cantidad||0)}</div></div>`;});
  html+=`<h2>Resumen</h2>`;Object.keys(pm).sort((a,b)=>pm[b]-pm[a]).forEach(k=>{html+=`<div class="row" style="padding:5px 0;border-bottom:1px solid var(--bd)"><span>${esc(k)}</span><span class="chip ch-gr">x${pm[k]}</span></div>`;});
  html+=`<div style="display:flex;gap:8px;margin-top:14px"><button class="b" onclick="genPDFDia()">📄 PDF</button><button class="b s" onclick="genImgDia()">📷 Imagen</button></div>`;
  sh(html);
}

/* ── Canvas utils ──────────────────────────────────────── */
function mkCanvas(w,h){const c=document.getElementById("exportCanvas");c.width=w;c.height=h;return c;}
function dlCanvas(c,name){const a=document.createElement("a");a.download=name+".png";a.href=c.toDataURL("image/png");a.click();}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

function genImgDia(){
  const hoy=db.ordenes.filter(o=>o.fecha===today()&&o.estado!=="cancelado").sort((a,b)=>a.clienteNombre.localeCompare(b.clienteNombre));
  if(!hoy.length)return;
  const pm={};hoy.forEach(o=>{(o.items||[{platoNombre:o.platoNombre,cantidad:o.cantidad}]).forEach(it=>{if(!pm[it.platoNombre])pm[it.platoNombre]=0;pm[it.platoNombre]+=it.cantidad;});});
  const W=680,pad=24,rowH=46;
  const totalRows=hoy.reduce((s,o)=>s+(o.items||[1]).length,0);
  const H=90+30+totalRows*rowH+30+Object.keys(pm).length*40+50;
  const c=mkCanvas(W,H);const ctx=c.getContext("2d");
  ctx.fillStyle="#fdf8f3";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#c0713a";ctx.fillRect(0,0,W,90);
  ctx.fillStyle="#fff";ctx.textAlign="center";
  ctx.font="bold 20px system-ui";ctx.fillText("EL BUEN GUSTO — ORDEN DEL DÍA",W/2,32);
  ctx.font="14px system-ui";ctx.fillStyle="rgba(255,255,255,0.8)";
  ctx.fillText(new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}),W/2,52);
  const tv=hoy.reduce((s,o)=>s+(o.totalCant||o.cantidad||0),0);
  ctx.font="bold 13px system-ui";ctx.fillText(hoy.length+" órdenes · "+tv+" viandas",W/2,70);
  let y=100;
  ctx.fillStyle="#8a7e72";ctx.font="bold 12px system-ui";ctx.textAlign="left";
  ctx.fillText("CLIENTE",pad,y);ctx.fillText("PLATOS",pad+200,y);ctx.fillText("ENTREGA",pad+430,y);ctx.textAlign="right";ctx.fillText("TOTAL",W-pad,y);y+=6;
  ctx.strokeStyle="#c0713a";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();y+=14;
  hoy.forEach((o,i)=>{
    const items=o.items||[{platoNombre:o.platoNombre,cantidad:o.cantidad}];
    const rh=Math.max(rowH,items.length*22+14);
    if(i%2===0){ctx.fillStyle="#f9f4ef";ctx.fillRect(pad-8,y-12,W-pad*2+16,rh);}
    ctx.fillStyle="#1e1a16";ctx.font="bold 15px system-ui";ctx.textAlign="left";ctx.fillText(o.clienteNombre.substring(0,22),pad,y);
    ctx.font="13px system-ui";ctx.fillStyle="#8a7e72";
    items.forEach((it,ii)=>ctx.fillText(it.platoNombre.substring(0,24)+" x"+it.cantidad,pad+200,y+ii*20));
    const entLabel=o.entrega==="retiro"?"🚶 Retira":"🚐 Mensajero";
    ctx.fillStyle="#1565c0";ctx.font="bold 12px system-ui";ctx.fillText(entLabel,pad+430,y);
    if(o.notas){ctx.fillStyle="#a06000";ctx.font="11px system-ui";ctx.fillText(o.notas.substring(0,22),pad+430,y+16);}
    ctx.fillStyle="#2f7a4a";ctx.font="bold 16px system-ui";ctx.textAlign="right";ctx.fillText(money(o.totalPrecio||o.precio*o.cantidad||0),W-pad,y);
    y+=rh;
  });
  y+=10;ctx.strokeStyle="#e8ddd2";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();y+=16;
  ctx.fillStyle="#1e1a16";ctx.font="bold 15px system-ui";ctx.textAlign="left";ctx.fillText("RESUMEN POR PLATO",pad,y);y+=12;
  Object.keys(pm).sort((a,b)=>pm[b]-pm[a]).forEach(k=>{ctx.fillStyle="#e3f0e9";rr(ctx,pad,y,W-pad*2,32,6);ctx.fill();ctx.fillStyle="#1b5e20";ctx.font="bold 14px system-ui";ctx.textAlign="left";ctx.fillText(k,pad+10,y+21);ctx.textAlign="right";ctx.fillText("x"+pm[k]+" unidades",W-pad-10,y+21);y+=40;});
  y+=6;ctx.fillStyle="#8a7e72";ctx.font="12px system-ui";ctx.textAlign="center";ctx.fillText("El Buen Gusto · "+new Date().toLocaleString("es-AR"),W/2,y);
  dlCanvas(c,"orden-chef-"+today());closeSh();toast("Imagen generada");

function genPDFOrden(id){
  const o=db.ordenes.find(o=>o.id===id);if(!o)return;
  const items=o.items||[{platoNombre:o.platoNombre,cantidad:o.cantidad,precio:o.precio}];
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a5"});

  doc.setTextColor(255,255,255);doc.setFontSize(13);doc.setFont("helvetica","bold");doc.text("ORDEN DE VIANDA — EL BUEN GUSTO",W/2,11,{align:"center"});
  doc.setFontSize(9);doc.setFont("helvetica","normal");doc.text(fd(o.fecha),W/2,19,{align:"center"});doc.text("Nro: "+(o.nro||o.id.toUpperCase()),W/2,26,{align:"center"});y=38;
  doc.setTextColor(100,80,60);doc.setFontSize(8);doc.setFont("helvetica","bold");doc.text("CLIENTE",mg,y);y+=4;
  doc.setDrawColor(200,180,160);doc.setLineWidth(0.3);doc.line(mg,y,W-mg,y);y+=5;

  if(o.notas){doc.setFillColor(254,243,208);doc.roundedRect(mg,y-2,W-mg*2,11,2,2,"F");doc.setTextColor(160,96,0);doc.setFontSize(9);doc.setFont("helvetica","bold");doc.text("NOTA: ",mg+3,y+4);doc.setFont("helvetica","normal");doc.text(o.notas.substring(0,40),mg+16,y+4);y+=15;}

function renderPts(){
  const fab=document.querySelector(".fab");if(fab)fab.style.display="none";
  const ppp=db.cfgPuntos.puntoPorPeso||1;
  const ranking=db.clientes.filter(c=>(c.puntos||0)>0).map(c=>({id:c.id,nombre:c.nombre,puntos:c.puntos||0})).sort((a,b)=>b.puntos-a.puntos);
  const maxPts=ranking.length?ranking[0].puntos:1;
  const medals=["🥇","🥈","🥉"];
  let html=`<div class="row" style="margin-bottom:10px"><h1 style="margin:0">⭐ Puntos</h1><button class="b w s" onclick="cfgPtsForm()">⚙️ Configurar</button></div>`;
  html+=`<div class="mu" style="margin-bottom:10px">1 punto por cada ${money(1/ppp).replace("$","")} pesos de compra</div>`;
  html+=`<h2>Premios disponibles</h2><div class="c">`;
  if(!db.premios.length)html+=`<div style="text-align:center;color:var(--mu);padding:12px">Sin premios. Configurá desde ⚙️</div>`;
  else db.premios.forEach(p=>{html+=`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><div><div style="font-size:13px;font-weight:700">${esc(p.nombre)}</div>${p.desc?`<div class="mu">${esc(p.desc)}</div>`:""}</div><span class="chip ch-pt">⭐ ${p.puntos} pts</span></div>`;});
  html+=`</div>`;
  html+=`<h2>Ranking de clientes</h2>`;
  if(!ranking.length)html+=`<div class="c" style="text-align:center;color:var(--mu);padding:24px">Aún no hay puntos. Se suman automáticamente al crear órdenes.</div>`;
  else{html+=`<div class="c">`;ranking.forEach((r,i)=>{const pct=Math.round(r.puntos/maxPts*100);html+=`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:${i<ranking.length-1?"1px solid var(--bd)":"none"}"><div style="width:28px;text-align:center;font-size:${i<3?16:13}px;font-weight:700;color:var(--mu);flex-shrink:0">${i<3?medals[i]:"#"+(i+1)}</div><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.nombre)}</div><div style="height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:3px 0"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--ac),#e8a060);border-radius:4px"></div></div></div><div style="text-align:right;flex-shrink:0"><span class="chip ch-pt" style="margin-bottom:4px">⭐ ${r.puntos}</span><div style="display:flex;gap:4px;justify-content:flex-end;margin-top:4px"><button class="b w s" style="padding:4px 8px;font-size:11px" onclick="abrirNotifPts('${r.id}')">📷</button><button class="b w s" style="padding:4px 8px;font-size:11px" onclick="abrirCanje('${r.id}')">Canjear</button></div></div></div>`;});html+=`</div>`;}
  const canjesRec=db.canjes.slice().sort((a,b)=>b.ts-a.ts).slice(0,20);
  if(canjesRec.length){html+=`<h2>Historial de canjes</h2><div class="c">`;canjesRec.forEach(cj=>{html+=`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--bd)"><div><div style="font-size:13px;font-weight:700">${esc(cj.clienteNombre)}</div><div class="mu">${esc(cj.premioNombre)} · ${fmtDate(cj.fecha)}</div></div><span class="chip ch-rd">-${cj.puntos} pts</span></div>`;});html+=`</div>`;}
  $("#app").innerHTML=html;
}

function abrirNotifPts(cliId){
  const c=db.clientes.find(c=>c.id===cliId);if(!c)return;
  sh(`<div class="hdl"></div><div class="row"><b>📷 Notificar puntos</b><button class="bk" onclick="this.closest('.sh').remove()">Cerrar</button></div>
<div style="font-size:15px;font-weight:700;margin-bottom:8px">${esc(c.nombre)}</div>
<div class="info gr" style="margin-bottom:10px">Puntos actuales: ${c.puntos||0}</div>
<label>Puntos a mostrar como "ganados"</label>
<input type="number" id="ptNuevos" placeholder="0" min="0" oninput="prevPtsImg('${c.id}')">
<div id="ptCanvas" style="margin-top:10px;display:none"><canvas id="canvasPts" style="width:100%;border-radius:12px"></canvas></div>
<button class="b" style="margin-top:10px" onclick="dlPtsImg('${c.id}')">📷 Descargar imagen WhatsApp</button>`);
}
function prevPtsImg(cliId){const c=db.clientes.find(c=>c.id===cliId);if(!c)return;const n=parseInt(document.getElementById("ptNuevos")?.value)||0;const w=document.getElementById("ptCanvas");if(!w)return;if(!n){w.style.display="none";return;}w.style.display="block";const cv=document.getElementById("canvasPts");dibujarPtsImg(cv,c.nombre,n,c.puntos||0);}
function dibujarPtsImg(canvas,nombre,nuevos,total){

function backup(){

  const blob=new Blob([JSON.stringify({app:"El Buen Gusto",version:2,fechaExport:new Date().toISOString(),db},null,2)],{type:"application/json"});
  const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download="backup-el-buen-gusto-"+today()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Copia de seguridad descargada");
}
function restore(inp){
  const file=inp.files&&inp.files[0];if(!file){toast("Sin archivo");return;}
  const reader=new FileReader();
  reader.onerror=()=>{const err=reader.error&&reader.error.message||"";/could not be found|NotFoundError|NotReadableError/i.test(err)?alert("No se pudo acceder al archivo. Guardalo primero en la carpeta Descargas del celular y elegilo desde ahí."):alert("No se pudo leer el archivo. Intentá de nuevo.");inp.value="";};
  reader.onload=()=>{
    let parsed;try{parsed=JSON.parse(reader.result);}catch(e){alert("El archivo no es un JSON válido.");inp.value="";return;}
    const data=parsed.db||parsed;
    if(!data||!Array.isArray(data.clientes)||!Array.isArray(data.platos)||!Array.isArray(data.ordenes)){alert("El archivo no tiene el formato esperado de una copia de El Buen Gusto.");inp.value="";return;}
    if(!confirm("Esto reemplazará TODOS tus datos con: "+data.clientes.length+" clientes, "+data.platos.length+" platos, "+data.ordenes.length+" ordenes, "+(data.pagos?.length||0)+" pagos. Continuar?")){inp.value="";return;}
    db=Object.assign(db,data,{contactosImportados:true});save();inp.value="";render();toast("Datos restaurados correctamente");
  };
  reader.readAsText(file);
}
function importVCF(inp){
  const file=inp.files&&inp.files[0];if(!file)return;
  const status=document.getElementById("importStatus");
  if(status)status.innerHTML='<div class="info am" style="margin-top:8px">Leyendo archivo...</div>';
  const reader=new FileReader();
  reader.onerror=function(){
    if(status)status.innerHTML='<div class="info rd" style="margin-top:8px">No se pudo leer el archivo. Guardalo en Descargas y elegilo desde ahi.</div>';
    inp.value="";
  };
  reader.onload=function(){
    const text=reader.result;
    // Split into individual vcards
    const cards=text.split("BEGIN:VCARD").slice(1);
    let nuevos=0,omitidos=0;
    const ex={};
    db.clientes.forEach(function(c){if(c.tel)ex[c.tel.replace(/ /g,"").replace(/-/g,"")]=true;});
    cards.forEach(function(card){
      // Extract FN (full name)
      let nombre="";
      const fnIdx=card.indexOf("\nFN");
      if(fnIdx===-1)return;
      const fnLine=card.substring(fnIdx+1,card.indexOf("\n",fnIdx+1));
      const fnColon=fnLine.indexOf(":");
      if(fnColon===-1)return;
      nombre=fnLine.substring(fnColon+1).replace(/\r/g,"").trim();
      // Try to decode quoted-printable
      if(nombre.indexOf("=")!==-1){
        try{
          const decoded=nombre.replace(/=([0-9A-Fa-f]{2})/g,function(m,h){return String.fromCharCode(parseInt(h,16));});
          nombre=decodeURIComponent(escape(decoded));
        }catch(e){}
      }
      nombre=nombre.trim();
      if(!nombre||nombre.length<2)return;
      // Extract TEL
      let tel="";
      const telIdx=card.indexOf("\nTEL");
      if(telIdx!==-1){
        const telLine=card.substring(telIdx+1,card.indexOf("\n",telIdx+1));
        const telColon=telLine.indexOf(":");
        if(telColon!==-1){
          tel=telLine.substring(telColon+1).replace(/\r/g,"").trim();
        }
      }
      const telC=tel.replace(/ /g,"").replace(/-/g,"").replace(/\(/g,"").replace(/\)/g,"");
      if(tel&&ex[telC]){omitidos++;return;}
      db.clientes.push({id:uid(),nombre:nombre,tel:tel,dir:"",puntos:0,ts:Date.now()});
      if(telC)ex[telC]=true;
      nuevos++;
    });
    save();inp.value="";
    const msg=nuevos+" contactos importados"+(omitidos>0?", "+omitidos+" ya existian":"");
    if(status)status.innerHTML='<div class="info gr" style="margin-top:8px">Listo: '+msg+'</div>';
    toast(msg);
  };
  reader.readAsText(file,"UTF-8");
}
